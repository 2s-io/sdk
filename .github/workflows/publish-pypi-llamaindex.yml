name: Publish PyPI (llama-index-tools-twosio)

# workflow_dispatch ONLY. Was also release-triggered, but since sdk-publish.ts
# auto-creates a GitHub Release on every mirror push (ensureRelease, 2026-06-09)
# the release event fired this on pushes where the adapter version was unchanged,
# so twine failed with "File already exists" — red CI noise on every push.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python-llamaindex
    permissions:
      contents: read
      id-token: write  # PyPI trusted publisher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install build twine
      - run: python -m build
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: twine upload dist/*
