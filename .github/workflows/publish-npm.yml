name: Publish npm

# workflow_dispatch ONLY — the daily release train dispatches sdk then mcp in
# order. The old release trigger double-fired once ensureRelease (2026-06-09)
# started creating a GitHub Release on every mirror push, racing the dispatches.
on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Which package to publish'
        required: true
        type: choice
        options:
          - sdk
          - mcp

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # for npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - name: Determine package
        id: pkg
        run: |
          if [ "${{ github.event.inputs.package }}" = "mcp" ]; then
            echo "dir=packages/2s-mcp" >> $GITHUB_OUTPUT
          else
            echo "dir=packages/2s-sdk" >> $GITHUB_OUTPUT
          fi
      - run: npm install --no-package-lock
        working-directory: ${{ steps.pkg.outputs.dir }}
      - run: npm run build
        working-directory: ${{ steps.pkg.outputs.dir }}
      - name: Publish to npm (idempotent)
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "$NAME@$VER already on npm — skipping publish"
          else
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # The MCP server (server.json) must also be published to the official MCP
      # registry on every mcp ship, or the registry listing drifts behind npm.
      # Uses GitHub OIDC (id-token: write above) — namespace io.github.2s-io/*
      # is authorized because this workflow runs in the 2s-io org. Idempotent:
      # re-dispatching mcp after npm is live still syncs the registry.
      - name: Publish to MCP registry
        if: ${{ github.event.inputs.package == 'mcp' }}
        working-directory: packages/2s-mcp
        run: |
          ASSET_URL=$(curl -sSL https://api.github.com/repos/modelcontextprotocol/registry/releases/latest \
            | grep -o 'https://[^"]*_linux_amd64.tar.gz' | head -1)
          echo "downloading mcp-publisher from $ASSET_URL"
          curl -sSL "$ASSET_URL" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
