[project]
name = "2sio"
version = "0.1.0"
description = "Python client for 2s.io — pay-per-call AI agent APIs on Base via x402."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Josh Alley", email = "josh@alley.io" }]
keywords = [
    "x402",
    "ai-agents",
    "agentic",
    "usdc",
    "base",
    "pay-per-call",
    "2s.io",
    "stablecoin",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "httpx>=0.27",
    "eth-account>=0.13",
    "x402[httpx]>=2.0",
]

[project.urls]
Homepage = "https://2s.io"
Source = "https://github.com/2s-io/sdk"
Issues = "https://github.com/2s-io/sdk/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twosio"]
